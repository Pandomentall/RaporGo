<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RaporGo — Görsel rapor editörü</title>
  <desc id="desc">RaporGo masaüstü editörünü, segment listesini, canlı sayfa önizlemesini ve özellik panelini gösteren GitHub sosyal önizlemesi.</desc>
