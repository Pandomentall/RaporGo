    <text x="0" y="254" fill="#FFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="720" letter-spacing="-2">editörde hazırla.</text>
    <text x="0" y="318" fill="#F0A500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="720" letter-spacing="-2">PDF olarak çıkar.</text>
    <text x="0" y="374" fill="#C7D2E7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Şablonunu seç, içeriğini düzenle, çıktını anında gör.</text>
    <text x="0" y="446" fill="#91A3C1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">JSON ve CLI otomasyonu, gerektiğinde aynı belgenin yanında.</text>
  </g>
